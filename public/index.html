<section id="loginPanel">
<p class="eyebrow">Fragancias Bruma</p><h1>Ingresar al negocio</h1>
<p>Acceso para usuarios autorizados.</p><form id="loginForm">
<label class="field">Correo electrónico<input type="email" id="loginEmail" autocomplete="username" required></label><br>
<label class="field">Contraseña<input type="password" id="loginPassword" autocomplete="current-password" required></label><br>
<button class="primary" id="loginButton" type="submit">Ingresar</button>
<button id="loginLogout" type="button" hidden>Cerrar sesión</button>
<p id="loginError" class="error" role="alert"></p></form></section>
<div class="app" id="businessApp" hidden><aside><div class="brand"><span>Fragancias</span><strong>BRUMA</strong><small>MIRAMAR</small></div><nav aria-label="Secciones" id="nav"></nav><div class="aside-bottom"><b>Tu negocio, en orden.</b>Perfumes, cosméticos y decants.<br>Importes en pesos argentinos.</div></aside>
<main id="mainContent" tabindex="-1"><header class="top"><div><p class="eyebrow">Control del negocio</p><h1 id="pageTitle" tabindex="-1">Resumen</h1></div><div class="top-actions"><button data-action="refresh">Actualizar</button><button data-action="logout">Salir</button><button data-action="backup">Exportar respaldo</button><button data-action="go" data-view="Guía">Cómo usar</button></div></header><p class="storage" id="storageStatus"></p><div id="content"></div></main></div>
<dialog id="editor" aria-labelledby="dialogTitle"><form id="entryForm"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" class="quiet" data-action="close" aria-label="Cerrar formulario">✕</button></div><div class="dialog-body"><div class="fields" id="fields"></div><div class="estimate" id="estimate" aria-live="polite"></div><p class="error" id="formError" role="alert"></p></div><div class="dialog-foot"><button type="button" data-action="close">Cancelar</button><button type="submit" class="primary">Guardar registro</button></div></form></dialog>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><div class="dialog-head"><h2 id="confirmTitle">Confirmar cambio</h2></div><div class="dialog-body"><p id="confirmText"></p></div><div class="dialog-foot"><button id="confirmNo">Cancelar</button><button id="confirmYes" class="primary">Confirmar</button></div></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden><div id="toast" role="status" aria-live="polite"></div>
