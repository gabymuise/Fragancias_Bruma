  if(r.type==='purchases'){const a=get(r.product);numeric(r.qty,'cantidad comprada',.000001,a.unit==='unidad');numeric(r.unitCost,'costo de compra');if(Math.abs(r.unitCost-a.cost)>.000001)throw Error(`La compra de ${a.code} tiene otro costo. Creá un código/lote nuevo para conservar el historial.`);move(a.id,r.qty,r);result.total=r.qty*r.unitCost;if(inYear)m.purchases+=result.total;}
  if(r.type==='productions'){const a=get(r.target),b=get(r.base),k=get(r.kit);if(new Set([a.id,b.id,k.id]).size!==3||a.category!=='Decant'||a.unit!=='unidad'||b.category!=='Perfume para decantar'||b.unit!=='ml'||k.category!=='Insumo'||k.unit!=='unidad')throw Error('Elegí un decant, un perfume base en ml y un kit de insumo por unidad distintos.');numeric(r.qty,'unidades de decant',1,true);numeric(r.size,'ml por decant',.000001);numeric(r.waste,'merma');const ml=r.qty*r.size+r.waste,cost=ml*b.cost+r.qty*k.cost;result={ml,total:cost,unitCost:cost/r.qty};if(Math.abs(a.cost-result.unitCost)>.000001)throw Error(`El costo de este lote de ${a.code} es ${money(result.unitCost)} por decant. Usá otro código de decant si ya tiene movimientos con un costo diferente.`);move(b.id,-ml,r);move(k.id,-r.qty,r);move(a.id,r.qty,r);}
  if(r.type==='sales'){const a=get(r.product);if(['Insumo','Perfume para decantar'].includes(a.category))throw Error('Registrá la venta con un perfume, cosmético, decant u otro producto terminado.');numeric(r.qty,'cantidad vendida',.000001,a.unit==='unidad');numeric(r.price,'precio');numeric(r.discount,'descuento');numeric(r.fee,'comisión');numeric(r.shipping,'envío');if(!CHANNELS.includes(r.channel)||r.discount>r.qty*r.price)throw Error('Revisá el canal y el descuento de la venta.');move(a.id,-r.qty,r);result={revenue:r.qty*r.price-r.discount,cogs:r.qty*a.cost,fees:r.fee+r.shipping};result.profit=result.revenue-result.cogs-result.fees;if(inYear){m.revenue+=result.revenue;m.cogs+=result.cogs;m.fees+=result.fees;}}
  if(r.type==='expenses'){numeric(r.amount,'importe');if(!EXPENSES.includes(r.category)||!['Efectivo','Transferencia','Tarjeta','Otro'].includes(r.payment))throw Error('Categoría o medio de pago no válido.');result.total=r.amount;if(inYear)m.expenses+=r.amount;}
  if(r.type==='adjustments'){const a=get(r.product);numeric(r.qty,'cantidad de ajuste',-1e12,a.unit==='unidad');if(r.qty===0||!REASONS.includes(r.reason))throw Error('Ingresá un ajuste distinto de cero y un motivo válido.');move(a.id,r.qty,r);result.total=r.qty*a.cost;if(inYear)m.adjustments+=result.total;}
  metrics.set(r.id,result);
 }
 for(const m of monthly)m.profit=m.revenue-m.cogs-m.fees-m.expenses+m.adjustments;
 const totals=monthly.reduce((acc,m)=>{for(const k of Object.keys(m))acc[k]=(acc[k]||0)+m[k];return acc;},{});
 return {p,stocks,monthly,metrics,totals,stockValue:d.products.reduce((n,a)=>n+a.cost*stocks.get(a.id),0),low:d.products.filter(a=>stocks.get(a.id)<=a.min)};
}
try{
 rawLoaded=localStorage.getItem(KEY);
 if(rawLoaded){const incoming=JSON.parse(rawLoaded);calculate(incoming);data=incoming;}
 else{data=clone(IMPORTED_DATA);calculate(data);data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));rawLoaded=JSON.stringify(data);}
}catch(e){storageError=rawLoaded?'No se pudieron cargar los datos guardados. No se sobrescribirán. Descargá los datos originales desde Guía antes de restaurarlos. '+e.message:'Los datos del Excel están disponibles, pero el navegador no permitió guardarlos. Exportá un respaldo antes de cerrar. '+e.message;}
async function loadExcelData(){
 if(!(await confirmChange('Cargar los datos del Excel: 12 productos, 12 compras y 4 gastos. Esto reemplaza los registros de este navegador; primero se descargará un respaldo del estado actual. ¿Continuar?')))return;
 if(storageError&&rawLoaded)download(`Bruma_recuperacion_${today()}.json`,rawLoaded,'application/json');else backup();
 const next=clone(IMPORTED_DATA);calculate(next);next.updatedAt=new Date().toISOString();
 try{localStorage.setItem(KEY,JSON.stringify(next));}catch(e){throw Error('No se pudo guardar. Los datos actuales no se modificaron.');}
 data=next;rawLoaded=JSON.stringify(next);storageError='';render();toast('Datos del Excel cargados: 12 productos, 12 compras y 4 gastos.');
}
function importNotice(){return data.importTag===IMPORT_TAG?'':`<div class="note"><b>Este HTML incluye tus datos del Excel.</b> Se conservaron los registros que ya estaban en este navegador. <button data-action="load-excel">Cargar datos del Excel</button></div>`;}

function save(next){calculate(next);if(storageError&&rawLoaded!==null)throw Error('Primero recuperá o restaurá los datos desde Guía para no sobrescribir el registro guardado.');next.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(next));}catch(e){throw Error('El navegador no permitió guardar. No se aplicó el cambio. Habilitá el almacenamiento local o abrí el archivo en otro navegador.');}data=next;storageError='';rawLoaded=JSON.stringify(next);render();toast('Registro guardado en este navegador.');}

function download(name,contents,type){const url=URL.createObjectURL(new Blob([contents],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function backup(){download(`Bruma_respaldo_${today()}.json`,JSON.stringify(data,null,2),'application/json');toast('Respaldo descargado. Guardalo en un lugar seguro.');}
function confirmChange(message){return new Promise(resolve=>{const modal=document.getElementById('confirmDialog');document.getElementById('confirmText').textContent=message;modal.showModal();let done=false;const finish=v=>{if(done)return;done=true;modal.close();resolve(v);};document.getElementById('confirmNo').onclick=()=>finish(false);document.getElementById('confirmYes').onclick=()=>finish(true);modal.oncancel=e=>{e.preventDefault();finish(false);};});}

function dashboard(c){const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];return `<section class="heading"><div><h2>Una mirada a Bruma</h2><p>Resultados del año y existencias actuales.</p></div><div class="controls"><label for="year">Año</label><input id="year" type="number" min="1900" max="9999" step="1" value="${year}" style="width:100px"><button class="primary" data-action="add" data-type="sales">+ Registrar venta</button></div></section>

 ${!data.products.length?'<div class="note">Bienvenido. Empezá cargando tus productos y el stock que ya tenés. Después registrá compras, preparaciones de decants y ventas. <button class="quiet" data-action="add" data-type="products">+ Crear primer producto</button></div>':''}
 <section class="panel"><div class="panel-head"><h3>Ganancias por mes</h3><span>${year} · ARS</span></div>${table(['Mes','#Ventas netas','#Costo vendido','#Comisión y envío','#Gastos','#Ajustes','#Ganancia'],c.monthly.map((m,i)=>'<tr>'+cell(months[i])+['revenue','cogs','fees','expenses','adjustments','profit'].map(k=>cell(money(m[k]),'right '+(k==='profit'?(m[k]<0?'neg':'positive'):''))).join('')+'</tr>').concat('<tr class="total">'+cell('Total anual')+['revenue','cogs','fees','expenses','adjustments','profit'].map(k=>cell(money(c.totals[k]),'right')).join('')+'</tr>'))}</section>
 <div class="split"><section class="panel"><div class="panel-head"><h3>Reposición</h3><button class="quiet" data-action="go" data-view="Productos">Ver productos</button></div>${c.low.length?'<div class="info-list">'+c.low.slice(0,8).map(a=>`<div class="info-line"><div>${esc(a.name)}<br><small>${esc(a.code)}</small></div><div>${fmt(c.stocks.get(a.id))} ${esc(a.unit)}<br><small>Mínimo: ${fmt(a.min)}</small></div></div>`).join('')+'</div>':'<div class="empty"><p>'+(!data.products.length?'Todavía no cargaste productos.':'Todos los productos superan su stock mínimo.')+'</p></div>'}</section><section class="panel"><div class="panel-head"><h3>Compras y gastos del año</h3><span>${year}</span></div><div class="info-list"><div class="info-line"><span>Compras de mercadería e insumos</span><b>${money(c.totals.purchases)}</b></div><div class="info-line"><span>Gastos del negocio</span><b>${money(c.totals.expenses)}</b></div><div class="info-line"><span>Comisiones y envíos absorbidos</span><b>${money(c.totals.fees)}</b></div></div></section></div><p class="footnote">La ganancia no es saldo de caja. Las compras de stock se reconocen como costo al vender; el stock actual incluye todas las fechas. No se calculan impuestos automáticamente.</p>`;}
function records(c){const type=TYPES[view];let rows=[],headers=[];const q=search.toLocaleLowerCase('es');let source=data[type].filter(r=>JSON.stringify(r).toLocaleLowerCase('es').includes(q)||[r.product,r.target,r.base,r.kit].some(id=>{const a=c.p.get(id);return a&&`${a.name} ${a.code}`.toLocaleLowerCase('es').includes(q);}));if(type!=='products')source.sort((a,b)=>b.date.localeCompare(a.date)||b.order-a.order);const descriptions={products:'Un código por producto y lote. Stock y valor actualizados automáticamente.',purchases:'Mercadería e insumos que ingresan al stock.',productions:'Prepará unidades listas para vender a partir de perfume en ml y kits de envase.',sales:'Un registro por producto vendido. Ganancia después de descuento, comisión y envío.',expenses:'Publicidad, plataforma, servicios y otros gastos que no son compras de stock.',adjustments:'Pérdidas, roturas, muestras y correcciones de inventario.'};
 if(type==='products'){headers=['Producto / lote','Categoría','#Costo unitario','#Precio sugerido','#Stock actual','#Mínimo','#Valor stock','Estado','Acciones'];rows=source.map(a=>'<tr>'+cell(productLabel(a))+cell(esc(a.category))+cell(money(a.cost),'right')+cell(money(a.price),'right')+cell(`${fmt(c.stocks.get(a.id))} <small>${esc(a.unit)}</small>`,'right')+cell(fmt(a.min),'right')+cell(money(a.cost*c.stocks.get(a.id)),'right')+cell(c.stocks.get(a.id)<=a.min?'<span class="badge low">Reponer</span>':'<span class="badge">Disponible</span>')+cell(actionButtons(type,a.id))+'</tr>');}
 else for(const r of source){const a=c.p.get(r.product),m=c.metrics.get(r.id);let cells=[cell(showDate(r.date))];if(type==='purchases'){headers=['Fecha','Producto / lote','#Cantidad','#Costo unitario','#Total','Proveedor / detalle','Acciones'];cells.push(cell(productLabel(a)),cell(`${fmt(r.qty)} ${esc(a.unit)}`,'right'),cell(money(r.unitCost),'right'),cell(money(m.total),'right'),cell(esc(r.note)));}
 if(type==='productions'){headers=['Fecha','Decant','#Unidades','#ml consumidos','Perfume base','Kit','#Costo por decant','#Costo lote','Acciones'];cells.push(cell(productLabel(c.p.get(r.target))),cell(fmt(r.qty),'right'),cell(fmt(m.ml),'right'),cell(esc(c.p.get(r.base).code)),cell(esc(c.p.get(r.kit).code)),cell(money(m.unitCost),'right'),cell(money(m.total),'right'));}
 if(type==='sales'){headers=['Fecha','Producto / lote','Canal','#Cantidad','#Venta neta','#Costo','#Comisión / envío','#Ganancia','#Margen','Pedido / cliente','Acciones'];cells.push(cell(productLabel(a)),cell(esc(r.channel)),cell(fmt(r.qty),'right'),cell(money(m.revenue),'right'),cell(money(m.cogs),'right'),cell(money(m.fees),'right'),cell(money(m.profit),'right '+(m.profit<0?'neg':'positive')),cell(m.revenue?fmt(m.profit/m.revenue*100)+' %':'—','right'),cell(esc(r.note)));}
 if(type==='expenses'){headers=['Fecha','Categoría','Detalle','#Importe','Medio de pago','Acciones'];cells.push(cell(esc(r.category)),cell(esc(r.note)),cell(money(r.amount),'right'),cell(esc(r.payment)));}
 if(type==='adjustments'){headers=['Fecha','Producto / lote','Motivo','#Cantidad','#Efecto en ganancia','Detalle','Acciones'];cells.push(cell(productLabel(a)),cell(esc(r.reason)),cell(fmt(r.qty),'right'),cell(money(m.total),'right '+(m.total<0?'neg':'')),cell(esc(r.note)));}cells.push(cell(actionButtons(type,r.id)));rows.push('<tr>'+cells.join('')+'</tr>');}
 if(!headers.length)headers=type==='products'?['Producto']:['Fecha','Registro','Importe','Acciones'];const tips={purchases:'Si una reposición tiene otro costo, creá un código/lote nuevo. Para perfume de decants, comprá en ml: 100 ml a $600/ml representan un frasco de $60.000.',productions:'El sistema descuenta perfume y kits, y suma decants. En la primera preparación fija automáticamente el costo del decant si su stock inicial es cero y no tiene movimientos.',sales:'Distribuí los descuentos, comisiones y envíos de un pedido entre sus productos, sin duplicarlos. El envío indicado es el gasto que absorbe Bruma.',expenses:'No vuelvas a cargar compras de stock, kits de decants, ni comisiones o envíos ya registrados en Ventas.',adjustments:'Cantidad negativa: sale stock y se reconoce su costo como pérdida. Cantidad positiva: aumenta stock y se reconoce un ajuste de ganancia.',products:'Los costos, unidades y stock inicial quedan fijos cuando un código ya tiene movimientos. Podés editar nombre, precio y mínimo. Para cambiar de costo, creá otro código/lote.'};
 return `<section class="heading"><div><h2>${view==='Decants'?'Preparación de decants':view}</h2><p>${descriptions[type]}</p></div><button class="primary" data-action="add" data-type="${type}">+ ${type==='products'?'Nuevo producto':type==='productions'?'Preparar decants':'Registrar '+LABELS[type]}</button></section><div class="heading"><span class="pill">${source.length} registros</span><div class="controls"><label for="search">Buscar</label><input id="search" type="search" placeholder="Producto, código o detalle" value="${esc(search)}"></div></div><section class="panel">${table(headers,rows,search?'No se encontraron coincidencias.':'Todavía no hay '+view.toLowerCase()+'.')}</section><div class="note">${tips[type]}</div>`;
}
function guide(){return `<div class="guide"><section class="heading"><div><h2>Todo lo necesario para empezar</h2><p>Una sola herramienta para perfumes, cosméticos, insumos y decants.</p></div></section>
 <section class="panel"><div class="panel-head"><h3>Copias de seguridad</h3><span>Archivo JSON</span></div><div class="backup-area"><p><b>Los datos quedan en este navegador y dispositivo.</b> No se guardan dentro del HTML ni se sincronizan entre computadoras. Borrar datos del navegador, usar modo privado, cambiar de navegador o mover el archivo puede hacer que dejen de aparecer.</p><button class="primary" data-action="backup">Exportar respaldo</button><button data-action="import">Importar respaldo</button>${storageError&&rawLoaded?'<button data-action="recovery">Descargar datos originales</button>':''}<p>Exportá un respaldo al terminar de trabajar. Para pasar los datos a otra computadora, abrí allí este HTML e importá el JSON. La importación reemplaza todos los registros actuales y primero descarga una copia de ellos.</p></div></section>
 <details open><summary>Datos incorporados del Excel</summary><p>Compras del 22/09/2026: <b>$682.730</b>. Gastos: <b>$103.110</b>. El stock de la carga inicial vale <b>$682.730</b>. Estos importes describen la carga de origen; el resumen se actualiza al registrar movimientos nuevos.</p><p>Se preservó la categoría <b>Decant</b> del producto «Frascco SIGNATURE 5ml». Si representa un envase vacío, editá ese producto y elegí <b>Insumo</b> antes de preparar decants. El sistema permite corregir una categoría siempre que sea compatible con los movimientos registrados.</p><p>Si este navegador ya tenía registros, se conservan y aparece el botón <b>Cargar datos del Excel</b>. Reemplaza esos registros solamente después de confirmar y descargar una copia de seguridad. No hay sincronización automática con Google Sheets.</p></details><details><summary>1. Productos y stock inicial</summary><p>Creá un código único por producto y lote, por ejemplo <code>PER-001-L1</code>. Completá categoría, unidad, costo unitario, precio sugerido y mínimo para reposición. Si ya tenés stock, cargalo como existencia inicial. No lo repitas en Compras.</p><p>Después de registrar movimientos, el costo y el stock inicial quedan bloqueados para conservar el historial. Si comprás a otro costo, creá otro código/lote del mismo producto. Para corregir existencias usá Ajustes.</p></details>
 <details><summary>2. Compras de productos e insumos</summary><p>Registrá cada ingreso con fecha, cantidad, código y costo unitario. Incluí el flete de compra prorrateado en ese costo. Las compras aumentan el stock; no se descuentan directamente de la ganancia.</p><p>El perfume para fraccionar se maneja en ml. Un frasco de 100 ml a $60.000 se carga como 100 ml a $600 por ml. Los frascos cerrados para reventa se cargan por unidad, en otro código.</p></details>
 <details><summary>3. Preparar decants de 5 ml</summary><ol><li>Creá un producto de categoría <b>Perfume para decantar</b>, unidad <b>ml</b>, y registrá su compra.</li><li>Creá un producto <b>Insumo</b> por unidad para el kit (frasco, atomizador y etiqueta). Su costo es la suma de esos componentes. Registrá la compra de los kits completos.</li><li>Creá el producto <b>Decant</b> por unidad, con stock inicial cero. Podés dejar el costo en cero: la primera preparación lo calcula.</li><li>En Decants elegí los tres códigos, la cantidad, 5 ml por unidad y la merma total real si hubo pérdidas durante el llenado.</li></ol><p>Se descuentan los ml y kits consumidos y se suman los decants listos para vender. El costo incluye la merma. Si otra preparación tiene un costo distinto, usá otro código/lote de decant.</p><p><b>Ejemplo:</b> 10 decants de 5 ml a $600/ml + 10 kits a $500 = $35.000 por lote, o $3.500 por decant, sin merma.</p></details>
 <details><summary>4. Ventas y ganancias</summary><p>Registrá una fila por producto/lote vendido, con precio real, descuento total, comisión total y envío a cargo de Bruma. En pedidos con varios productos, distribuí esos cargos una sola vez. La herramienta evita vender más stock del disponible.</p><p><b>Ganancia directa = venta neta − costo vendido − comisión − envío.</b> El Resumen resta además los gastos del negocio y suma o resta los ajustes de inventario. La venta de 2 decants a $7.000 con costo de $3.500 deja $7.000 antes de cargos y gastos.</p><p>Los registros se ordenan por fecha y, dentro de un mismo día, por orden de carga. Cargá primero la compra o preparación que permite la venta. Las ventas registradas se consideran realizadas aunque todavía no se hayan cobrado.</p></details>
 <details><summary>5. Gastos, ajustes y correcciones</summary><p>En Gastos cargá publicidad, plataforma, servicios y embalajes consumidos no controlados como stock. No dupliques costos ya registrados en Compras o Ventas.</p><p>Usá Ajustes negativos para roturas, regalos, muestras o faltantes; positivos para sobrantes de conteo. Se valúan al costo del producto. No son compras. Editar o eliminar registros recalcula todo y se impide si dejaría stock negativo.</p><p>Para abrir un frasco cerrado del stock: registrá una Transferencia de +100 ml al código base y otra de −1 unidad al código del frasco cerrado, en la misma fecha, con costos equivalentes. Los dos efectos monetarios deben sumar cero. Completá ambos ajustes antes de interpretar el resumen.</p></details>
 <details><summary>6. Qué muestra el resumen</summary><p>Elegí el año para consultar resultados mensuales. El valor de stock y las alertas de reposición muestran todas las existencias actuales, sin filtro de año. Un mínimo de cero avisa cuando se agota el producto.</p><p>La ganancia estimada no es el saldo de caja. Esta versión no controla cobros pendientes, deudas, aportes o retiros, y no calcula impuestos automáticamente. Esta versión incorpora los 12 productos, 12 compras y 4 gastos de tu hoja. No hay ventas ni preparaciones de decants en esa carga inicial. Las categorías y los importes se conservaron como estaban en la fuente.</p></details>
 <details><summary>7. Uso del archivo</summary><p>Abrí <b>Fragancias_Bruma.html</b> con Chrome, Edge o Firefox. Funciona sin conexión y no necesita instalar programas ni tener un servidor. Conservá siempre la misma ubicación del HTML y el mismo navegador, y hacé copias de seguridad frecuentes.</p><p>Trabajá en una sola pestaña a la vez. Si abrís otra copia, no sincronizará automáticamente cambios pendientes. La aplicación usa JavaScript y almacenamiento local del navegador.</p></details></div>`;}
function field(name,label,type='text',value='',options={}){const attrs=`id="f-${name}" name="${name}" ${options.disabled?'disabled':''} ${options.required===false?'':'required'}`;let control;if(type==='select')control=`<select ${attrs}><option value="">Seleccionar…</option>${options.choices.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`;else control=`<input ${attrs} type="${type}" value="${esc(value)}" ${type==='number'?`step="${options.step||'any'}" min="${options.min??0}" max="1000000000000"`:''} ${type==='date'?`min="1900-01-01" max="${today()}"`:''} ${type==='text'?'maxlength="300"':''}>`;return `<label class="field ${options.wide?'wide':''}" for="f-${name}">${label}${control}${options.help?`<small>${esc(options.help)}</small>`:''}</label>`;}
function openEditor(type,id=null){const r=id?data[type].find(x=>x.id===id):{};if(!r)return;editing={type,id};document.getElementById('dialogTitle').textContent=(id?'Editar ':'Registrar ')+LABELS[type];const c=calculate(data),locked=type==='products'&&id&&references(data,id);const choices=filter=>data.products.filter(filter||(()=>true)).map(a=>[a.id,`${a.code} · ${a.name} (${fmt(c.stocks.get(a.id))} ${a.unit})`]);let f=[];const F=(...args)=>f.push(field(...args));
 if(type==='products'){F('code','Código / lote','text',r.code||'');F('name','Nombre y presentación','text',r.name||'');F('category','Categoría','select',r.category||'Perfume',{choices:CATS});F('unit','Unidad de stock','select',r.unit||'unidad',{choices:['unidad','ml'],disabled:locked});F('cost','Costo unitario (ARS)','number',r.cost??0,{disabled:locked,help:'Decant nuevo sin stock: el costo se fija al preparar.'});F('price','Precio de venta sugerido (ARS)','number',r.price??0);F('initial','Stock inicial','number',r.initial??0,{disabled:locked});F('min','Stock mínimo','number',r.min??0);}
 else{F('date','Fecha','date',r.date||today());if(type==='productions'){F('target','Decant terminado','select',r.target||'',{choices:choices(a=>a.category==='Decant'),wide:true});F('base','Perfume base en ml','select',r.base||'',{choices:choices(a=>a.category==='Perfume para decantar'&&a.unit==='ml'),wide:true});F('kit','Kit de envase','select',r.kit||'',{choices:choices(a=>a.category==='Insumo'&&a.unit==='unidad'),wide:true});F('qty','Cantidad de decants','number',r.qty??1,{min:1,step:1});F('size','ml por decant','number',r.size??5,{min:.000001});F('waste','Merma total (ml)','number',r.waste??0);}
 else if(type!=='expenses'){F('product','Producto / lote','select',r.product||'',{choices:choices(a=>type!=='sales'||!['Insumo','Perfume para decantar'].includes(a.category)),wide:true});F('qty',type==='adjustments'?'Cantidad (+ entrada / − salida)':'Cantidad','number',r.qty??(type==='adjustments'?-1:1),{min:type==='adjustments'?-1e12:.000001});}
 if(type==='purchases')F('unitCost','Costo unitario real (ARS)','number',r.unitCost??0,{help:'Debe coincidir con el costo de este código/lote.'});
 if(type==='sales'){F('channel','Canal de venta','select',r.channel||'WhatsApp',{choices:CHANNELS});F('price','Precio unitario (ARS)','number',r.price??0);F('discount','Descuento total (ARS)','number',r.discount??0);F('fee','Comisión total (ARS)','number',r.fee??0);F('shipping','Envío a cargo de Bruma (ARS)','number',r.shipping??0);}
 if(type==='expenses'){F('category','Categoría','select',r.category||'Publicidad',{choices:EXPENSES});F('amount','Importe (ARS)','number',r.amount??0);F('payment','Medio de pago','select',r.payment||'Transferencia',{choices:['Efectivo','Transferencia','Tarjeta','Otro']});}
 if(type==='adjustments')F('reason','Motivo','select',r.reason||'Rotura',{choices:REASONS});F('note',type==='sales'?'Pedido / cliente':type==='purchases'?'Proveedor / comprobante':'Detalle / referencia','text',r.note||'',{required:type==='expenses',wide:true});}
 document.getElementById('fields').innerHTML=f.join('');document.getElementById('formError').textContent='';document.getElementById('estimate').textContent='';document.getElementById('editor').showModal();updateEstimate();}
function updateEstimate(){if(!editing)return;const form=document.getElementById('entryForm'),f=Object.fromEntries(new FormData(form)),type=editing.type;let msg='';const p=id=>data.products.find(a=>a.id===id);if(type==='productions'){const b=p(f.base),k=p(f.kit),a=p(f.target),q=Number(f.qty),ml=q*Number(f.size)+Number(f.waste);if(a&&b&&k&&q>0&&ml>0){const cost=ml*b.cost+q*k.cost;msg=`Consumo: ${fmt(ml)} ml y ${fmt(q)} kits. Costo del lote: ${money(cost)}. Costo por decant: ${money(cost/q)}.`;}}
 if(type==='sales'&&p(f.product)){const a=p(f.product),q=Number(f.qty),net=q*Number(f.price)-Number(f.discount),profit=net-q*a.cost-Number(f.fee)-Number(f.shipping);msg=`Venta neta: ${money(net)}. Costo vendido: ${money(q*a.cost)}. Ganancia directa: ${money(profit)}.`;}
 if(type==='purchases'&&p(f.product))msg=`Total compra: ${money(Number(f.qty)*Number(f.unitCost))}. Costo del código elegido: ${money(p(f.product).cost)}.`;
 if(type==='products'&&editing.id&&references(data,editing.id))msg='Este producto ya tiene movimientos. Costo, unidad y stock inicial están bloqueados para conservar el historial.';
 document.getElementById('estimate').textContent=msg;}
document.getElementById('entryForm').addEventListener('input',updateEstimate);
document.getElementById('entryForm').addEventListener('change',e=>{if(e.target.name==='product'){const a=data.products.find(x=>x.id===e.target.value);if(a){if(editing.type==='purchases')document.getElementById('f-unitCost').value=a.cost;if(editing.type==='sales')document.getElementById('f-price').value=a.price;}}if(editing.type==='products'&&e.target.name==='category'&&!document.getElementById('f-unit').disabled){document.getElementById('f-unit').value=e.target.value==='Perfume para decantar'?'ml':'unidad';}updateEstimate();});
function commitEntry(type,id,fields){const next=clone(data),old=id?next[type].find(a=>a.id===id):null;const record={...(old||{}),...fields,id:id||uid()};if(type!=='products'){record.order=old?.order??Math.max(Date.now(),...Object.values(TYPES).filter(t=>t!=='products').flatMap(t=>next[t].slice(-1).map(x=>x.order+1)));record.note=record.note||'';}
 const nums={products:['cost','price','initial','min'],purchases:['qty','unitCost'],productions:['qty','size','waste'],sales:['qty','price','discount','fee','shipping'],expenses:['amount'],adjustments:['qty']};for(const k of nums[type]){if(record[k]===''||record[k]===undefined)throw Error('Completá todos los importes y cantidades.');record[k]=Number(record[k]);}for(const k of Object.keys(record))if(typeof record[k]==='string')record[k]=record[k].trim();
 if(type==='products'){record.code=record.code.toUpperCase();if(id&&references(data,id))for(const k of ['cost','initial','unit'])if(record[k]!==old[k])throw Error('No se puede cambiar el costo, stock inicial o unidad de un producto con movimientos.');}
 if(type==='productions'){const a=next.products.find(p=>p.id===record.target),b=next.products.find(p=>p.id===record.base),k=next.products.find(p=>p.id===record.kit);if(a&&b&&k&&record.qty>0&&!references(data,a.id)&&a.initial===0)a.cost=((record.qty*record.size+record.waste)*b.cost+record.qty*k.cost)/record.qty;}
 if(id)next[type][next[type].findIndex(x=>x.id===id)]=record;else next[type].push(record);save(next);}
document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();try{commitEntry(editing.type,editing.id,Object.fromEntries(new FormData(e.target)));document.getElementById('editor').close();}catch(err){document.getElementById('formError').textContent=err.message;}});
document.addEventListener('click',async e=>{const button=e.target.closest('button[data-action]');if(!button)return;const {action,type,id}=button.dataset;try{
 if(action==='go'){view=button.dataset.view;search='';render();}
 if(action==='add'||action==='edit')openEditor(type,action==='edit'?id:null);
 if(action==='close')document.getElementById('editor').close();
 if(action==='backup')backup();
 if(action==='load-excel')await loadExcelData();
 if(action==='import')document.getElementById('importFile').click();
 if(action==='recovery')download(`Bruma_recuperacion_${today()}.json`,rawLoaded||'','application/json');
 if(action==='delete'){if(type==='products'&&references(data,id))throw Error('No se puede eliminar un producto que tiene movimientos. Conservá su historial.');if(await confirmChange('¿Eliminar este registro? Se recalcularán el stock y las ganancias. Podés exportar un respaldo antes de continuar.')){const next=clone(data);next[type]=next[type].filter(r=>r.id!==id);save(next);}}
 }catch(err){toast(err.message);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;document.getElementById('content').innerHTML=importNotice()+records(calculate(data));const input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos);}});
document.addEventListener('change',e=>{if(e.target.id==='year'){const v=Number(e.target.value);if(Number.isInteger(v)&&v>=1900&&v<=9999){year=v;render();}else toast('Ingresá un año válido.');}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>20*1024*1024)throw Error('El respaldo supera el límite de 20 MB.');const incoming=JSON.parse(await file.text());calculate(incoming);if(!(await confirmChange(`Vas a reemplazar los datos actuales por este respaldo: ${incoming.products.length} productos y ${incoming.sales.length} ventas. Primero se descargará una copia del estado actual. ¿Continuar?`)))return;if(storageError&&rawLoaded)download(`Bruma_recuperacion_${today()}.json`,rawLoaded,'application/json');else backup();incoming.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(incoming));}catch(err){throw Error('No se pudo guardar el respaldo. Los datos actuales se conservaron.');}data=incoming;rawLoaded=JSON.stringify(incoming);storageError='';render();toast('Respaldo restaurado.');}catch(err){toast('No se importó: '+err.message);}});
// Prevent overwriting changes made in another tab using the same storage.
window.addEventListener('storage',e=>{if(e.key===KEY){storageError='Los datos cambiaron en otra pestaña. Recargá esta página antes de seguir para no sobrescribirlos.';rawLoaded=e.newValue??'';render();}});
render();
</script>
